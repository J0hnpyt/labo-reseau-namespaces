<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#fbfbfd; }
  #diagram { font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; display:block; }
</style>
</head>
<body>
<svg id="diagram" width="1060" height="780" viewBox="0 0 1060 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f5f8"/>
    </linearGradient>
    <linearGradient id="fwgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3444"/>
      <stop offset="1" stop-color="#1b2230"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#9aa3b2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="780" fill="url(#bg)"/>

  <!-- Title -->
  <text x="530" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Architecture du labo réseau</text>
  <text x="530" y="64" text-anchor="middle" font-size="13.5" fill="#86868b">Un réseau d'entreprise complet, simulé sur une seule machine avec les namespaces Linux</text>

  <!-- ===== Internet (cloud + globe) ===== -->
  <g transform="translate(530,132)">
    <path d="M-44,8 a22,22 0 0 1 8,-43 a28,28 0 0 1 54,-6 a20,20 0 0 1 10,38 a16,16 0 0 1 -6,11 l-70,0 a16,16 0 0 1 0,6 z" fill="#eaf2fe" stroke="#9cc3f5" stroke-width="2"/>
    <circle cx="6" cy="-10" r="15" fill="none" stroke="#2f80ed" stroke-width="1.6"/>
    <ellipse cx="6" cy="-10" rx="6" ry="15" fill="none" stroke="#2f80ed" stroke-width="1.4"/>
    <line x1="-9" y1="-10" x2="21" y2="-10" stroke="#2f80ed" stroke-width="1.4"/>
    <text x="0" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#1d1d1f">Internet</text>
  </g>

  <!-- Internet -> PC -->
  <line x1="530" y1="190" x2="530" y2="206" stroke="#9aa3b2" stroke-width="2.2" marker-end="url(#ar)"/>

  <!-- ===== PC host (laptop) ===== -->
  <g transform="translate(400,210)">
    <rect x="0" y="0" width="260" height="78" rx="16" fill="#ffffff" filter="url(#soft)"/>
    <!-- laptop icon -->
    <g transform="translate(26,24)">
      <rect x="0" y="0" width="38" height="26" rx="3" fill="#eef1f6" stroke="#64748b" stroke-width="2"/>
      <rect x="6" y="5" width="26" height="16" rx="1.5" fill="#cbd5e1"/>
      <path d="M-5,30 L43,30 L47,34 L-9,34 Z" fill="#64748b"/>
    </g>
    <text x="150" y="33" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">PC Debian (l'hôte)</text>
    <text x="150" y="54" text-anchor="middle" font-size="11.5" fill="#86868b">Wi-Fi vers Internet + NAT de sortie</text>
  </g>

  <!-- PC -> ns-fw with uplink pill -->
  <line x1="530" y1="288" x2="530" y2="338" stroke="#9aa3b2" stroke-width="2.2"/>
  <g transform="translate(590,300)">
    <rect x="0" y="0" width="172" height="26" rx="13" fill="#ffffff" stroke="#e2e6ec"/>
    <text x="86" y="17" text-anchor="middle" font-size="10.5" fill="#6b7280">uplink · 10.200.200.0/30</text>
  </g>

  <!-- ===== ns-fw (central, shield) ===== -->
  <g transform="translate(360,338)">
    <rect x="0" y="0" width="340" height="120" rx="20" fill="url(#fwgrad)" filter="url(#soft)"/>
    <!-- shield icon -->
    <g transform="translate(34,30)">
      <path d="M26,0 L50,9 V30 C50,46 39,56 26,62 C13,56 2,46 2,30 V9 Z" fill="#334155" stroke="#7c8aa0" stroke-width="2"/>
      <path d="M15,30 l8,8 l15,-17" fill="none" stroke="#5ac8fa" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="196" y="42" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">ns-fw</text>
    <text x="196" y="64" text-anchor="middle" font-size="12" fill="#cbd5e1">Routeur &amp; pare-feu (nftables)</text>
    <text x="196" y="83" text-anchor="middle" font-size="12" fill="#cbd5e1">DHCP · DNS · NAT</text>
    <g transform="translate(120,96)">
      <rect x="0" y="0" width="152" height="20" rx="10" fill="#3b4150"/>
      <text x="76" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#ffd27a">politique : deny by default</text>
    </g>
  </g>

  <!-- Fan-out lines to the 3 segments -->
  <!-- to LAN -->
  <path d="M400,430 C300,470 230,480 195,500" fill="none" stroke="#0071e3" stroke-width="2.6"/>
  <!-- to MGMT -->
  <line x1="530" y1="458" x2="530" y2="520" stroke="#af52de" stroke-width="2.6"/>
  <!-- to DMZ -->
  <path d="M700,430 C800,470 835,480 865,500" fill="none" stroke="#34c759" stroke-width="2.6"/>

  <!-- gateway badges -->
  <g transform="translate(286,452)"><rect x="0" y="0" width="52" height="20" rx="10" fill="#eaf2fe"/><text x="26" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#0071e3">.254</text></g>
  <g transform="translate(504,478)"><rect x="0" y="0" width="52" height="20" rx="10" fill="#f6ecfe"/><text x="26" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#af52de">.254</text></g>
  <g transform="translate(722,452)"><rect x="0" y="0" width="52" height="20" rx="10" fill="#e8faef"/><text x="26" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#1a9e46">.254</text></g>

  <!-- ===== LAN segment (monitor) ===== -->
  <g transform="translate(60,500)">
    <rect x="0" y="0" width="270" height="130" rx="18" fill="#ffffff" filter="url(#soft)"/>
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#0071e3"/>
    <g transform="translate(26,30)">
      <rect x="0" y="0" width="40" height="28" rx="3" fill="#eef4fe" stroke="#0071e3" stroke-width="2"/>
      <rect x="5" y="5" width="30" height="13" rx="1.5" fill="#bcd8fb"/>
      <rect x="16" y="28" width="8" height="7" fill="#0071e3"/>
      <rect x="10" y="35" width="20" height="3" rx="1.5" fill="#0071e3"/>
    </g>
    <text x="90" y="34" font-size="15" font-weight="700" fill="#1d1d1f">Segment LAN</text>
    <text x="90" y="53" font-size="11.5" fill="#0071e3" font-weight="600">192.168.10.0/24</text>
    <line x1="26" y1="74" x2="244" y2="74" stroke="#eef0f3" stroke-width="1.4"/>
    <text x="26" y="96" font-size="12.5" font-weight="700" fill="#1d1d1f">ns-lan</text>
    <text x="26" y="114" font-size="11" fill="#86868b">Poste utilisateur — adresse automatique (DHCP)</text>
  </g>

  <!-- ===== DMZ segment (server) ===== -->
  <g transform="translate(730,500)">
    <rect x="0" y="0" width="270" height="130" rx="18" fill="#ffffff" filter="url(#soft)"/>
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#34c759"/>
    <g transform="translate(26,26)">
      <rect x="0" y="0" width="40" height="15" rx="3" fill="#eafaf0" stroke="#1a9e46" stroke-width="2"/>
      <circle cx="8" cy="7.5" r="2.4" fill="#34c759"/>
      <rect x="0" y="20" width="40" height="15" rx="3" fill="#eafaf0" stroke="#1a9e46" stroke-width="2"/>
      <circle cx="8" cy="27.5" r="2.4" fill="#34c759"/>
    </g>
    <text x="90" y="34" font-size="15" font-weight="700" fill="#1d1d1f">Segment DMZ</text>
    <text x="90" y="53" font-size="11.5" fill="#1a9e46" font-weight="600">192.168.20.0/24</text>
    <line x1="26" y1="74" x2="244" y2="74" stroke="#eef0f3" stroke-width="1.4"/>
    <text x="26" y="96" font-size="12.5" font-weight="700" fill="#1d1d1f">ns-dmz</text>
    <text x="26" y="114" font-size="11" fill="#86868b">Serveur web + SSH — zone exposée</text>
  </g>

  <!-- ===== Management segment (terminal) ===== -->
  <g transform="translate(395,560)">
    <rect x="0" y="0" width="270" height="130" rx="18" fill="#ffffff" filter="url(#soft)"/>
    <rect x="0" y="0" width="270" height="6" rx="3" fill="#af52de"/>
    <g transform="translate(26,28)">
      <rect x="0" y="0" width="40" height="30" rx="4" fill="#1d1d1f"/>
      <path d="M8,10 l7,5 l-7,5" fill="none" stroke="#af52de" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="19" y1="20" x2="30" y2="20" stroke="#c9a6ea" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <text x="90" y="34" font-size="15" font-weight="700" fill="#1d1d1f">Segment Management</text>
    <text x="90" y="53" font-size="11.5" fill="#af52de" font-weight="600">192.168.30.0/24</text>
    <line x1="26" y1="74" x2="244" y2="74" stroke="#eef0f3" stroke-width="1.4"/>
    <text x="26" y="96" font-size="12.5" font-weight="700" fill="#1d1d1f">ns-mgmt</text>
    <text x="26" y="114" font-size="11" fill="#86868b">Administration des serveurs (SSH)</text>
  </g>

  <!-- ===== Legend card (flows) ===== -->
  <g transform="translate(60,112)">
    <rect x="0" y="0" width="236" height="166" rx="16" fill="#ffffff" filter="url(#soft)"/>
    <text x="20" y="28" font-size="12.5" font-weight="700" fill="#1d1d1f">Qui peut parler à qui&#160;?</text>
    <!-- allowed -->
    <circle cx="26" cy="50" r="7" fill="#e8faef"/><path d="M22.5,50 l2.5,2.5 l4.5,-5" fill="none" stroke="#1a9e46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="54" font-size="10.8" fill="#334155">LAN → DMZ : web (port 80)</text>
    <circle cx="26" cy="72" r="7" fill="#e8faef"/><path d="M22.5,72 l2.5,2.5 l4.5,-5" fill="none" stroke="#1a9e46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="76" font-size="10.8" fill="#334155">Management → DMZ : SSH (22)</text>
    <circle cx="26" cy="94" r="7" fill="#e8faef"/><path d="M22.5,94 l2.5,2.5 l4.5,-5" fill="none" stroke="#1a9e46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="40" y="98" font-size="10.8" fill="#334155">LAN / Mgmt → Internet</text>
    <!-- blocked -->
    <circle cx="26" cy="116" r="7" fill="#fdeaea"/><path d="M23,113 l6,6 M29,113 l-6,6" stroke="#d1343b" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="120" font-size="10.8" fill="#334155">DMZ → LAN (bloqué)</text>
    <circle cx="26" cy="138" r="7" fill="#fdeaea"/><path d="M23,135 l6,6 M29,135 l-6,6" stroke="#d1343b" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="142" font-size="10.8" fill="#334155">LAN → DMZ : SSH (bloqué)</text>
    <text x="20" y="160" font-size="9.3" fill="#a1a1a6">Tout le reste est bloqué par défaut.</text>
  </g>

  <!-- ===== Note card (right) ===== -->
  <g transform="translate(764,112)">
    <rect x="0" y="0" width="236" height="166" rx="16" fill="#ffffff" filter="url(#soft)"/>
    <text x="20" y="28" font-size="12.5" font-weight="700" fill="#1d1d1f">L'idée en une phrase</text>
    <text x="20" y="52" font-size="10.8" fill="#334155">Tout le trafic entre les zones</text>
    <text x="20" y="69" font-size="10.8" fill="#334155">et vers Internet passe par</text>
    <text x="20" y="86" font-size="10.8" fill="#334155"><tspan font-weight="700" fill="#1d1d1f">ns-fw</tspan>, le point de contrôle</text>
    <text x="20" y="103" font-size="10.8" fill="#334155">unique.</text>
    <text x="20" y="130" font-size="10.8" fill="#334155">Il y applique le routage, le</text>
    <text x="20" y="147" font-size="10.8" fill="#334155">pare-feu, le DHCP/DNS et le</text>
    <text x="20" y="164" font-size="10.8" fill="#334155">NAT de sortie.</text>
  </g>

</svg>
</body>
</html>
